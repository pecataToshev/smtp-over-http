name: Docker Build and Push
description: |
  Reusable composite action to build and push container images.
  Sets up Buildx, logs into the registry, extracts tags/labels, then builds and pushes.
  Caller must set job permissions (packages: write for GHCR) and typically checkout first.

inputs:
  image:
    description: Full image name without tag, e.g. ghcr.io/owner/myapp
    required: true

  context:
    description: Build context path
    required: false
    default: "."

  file:
    description: Dockerfile path (relative to context)
    required: false
    default: "Dockerfile"

  registry:
    description: Container registry
    required: false
    default: "ghcr.io"

  username:
    description: Registry login username. Defaults to github.actor if empty.
    required: false
    default: ""

  password:
    description: Registry login password/token. Use secrets.GITHUB_TOKEN for GHCR. If empty, login step is skipped.
    required: false
    default: ""

  tags:
    description: |
      Additional tag rules (multiline) passed to docker/metadata-action.
      These are appended to the built-in defaults:
        type=sha,prefix=sha-
        type=raw,value=latest,enable={{is_default_branch}}
    required: false
    default: ""

  push:
    description: Whether to push the image
    required: false
    default: "true"

  load:
    description: Load the image into the local Docker daemon after build
    required: false
    default: "false"

  platforms:
    description: Comma-separated list of platforms (e.g. linux/amd64,linux/arm64)
    required: false
    default: ""

  cache:
    description: Enable GitHub Actions layer caching
    required: false
    default: "true"

  build-args:
    description: |
      Build arguments. Newline separated KEY=VALUE pairs.
    required: false
    default: ""

  target:
    description: Target build stage name
    required: false
    default: ""

outputs:
  tags:
    description: Generated image tags (from metadata)
    value: ${{ steps.meta.outputs.tags }}
  labels:
    description: Generated image labels (from metadata)
    value: ${{ steps.meta.outputs.labels }}
  imageid:
    description: Built image ID
    value: ${{ steps.build.outputs.imageid }}
  digest:
    description: Pushed image digest
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to registry
      if: ${{ inputs.password != '' }}
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username || github.actor }}
        password: ${{ inputs.password }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ inputs.image }}
        tags: |
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}
          ${{ inputs.tags }}

    - name: Build and push
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: ${{ inputs.push }}
        load: ${{ inputs.load }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: ${{ inputs.platforms }}
        target: ${{ inputs.target }}
        cache-from: ${{ inputs.cache == 'true' && 'type=gha' || '' }}
        cache-to: ${{ inputs.cache == 'true' && 'type=gha,mode=max' || '' }}
        build-args: |
          ${{ inputs.build-args }}
